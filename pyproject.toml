[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "recurra"
dynamic = ["version"]
description = "Recurrence analysis over arbitrary state spaces, for multivariate and cross-frequency-coupled signals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ignacio Rodriguez-Rodriguez"}, {name = "Andres Ortiz Garcia"}]
keywords = ["recurrence plot", "RQA", "cross-frequency coupling", "nonlinear dynamics", "EEG"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# Floors verified by running the full suite on both ends of the range:
#   Python 3.10.9 / numpy 1.26.4 / scipy 1.10.0 / pandas 1.5.3  (Windows)
#   Python 3.12.3 / numpy 2.4.4  / scipy 1.17.1 / pandas 3.0.2  (Linux)
# The `minimum-versions` CI job pins the floors so this claim cannot rot.
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5"]

[project.optional-dependencies]
# Each extra installs what the code imports, and nothing it does not: numba
# and torch were listed for accelerations that are specified but not written
# (DD-16, DD-17), so they are not offered until they exist.
io   = ["h5py>=3.8", "pyedflib>=0.1.30"]
ml   = ["scikit-learn>=1.1"]
viz  = ["matplotlib>=3.7", "pillow>=10.0"]
parallel = ["joblib>=1.3"]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-xdist>=3.5", "coverage>=7.4",
        "ruff==0.16.*", "mypy>=1.8"]
all  = ["recurra[io,ml,viz,parallel]"]

[project.scripts]
recurra = "recurra.cli:main"

[tool.hatch.version]
path = "src/recurra/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recurra"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
# E702: paired one-line statements (`na = ...; nb = ...`) are deliberate.
ignore = ["E501", "E702"]

[tool.ruff.lint.per-file-ignores]
# Lempel-Ziv keeps Kaspar and Schuster's own variable names (i, k, l, c), so
# the code can be checked line by line against the paper.
"src/recurra/dynamics/complexity.py" = ["E741"]
"tests/*" = ["E741"]
# The examples are Spyder cell scripts: imports belong next to the cell that uses them.
"examples/*" = ["E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The library's own caveats are informative during analysis and noise during a
# test run. Tests that assert on a warning use pytest.warns, which overrides
# these filters, so nothing is hidden from the tests themselves [DD-46].
filterwarnings = [
    "ignore::recurra.exceptions.RecurraWarning",
]
markers = [
    "requires(*modules): skip unless these optional backends are importable (see tests/conftest.py).",
    "slow: regenerates a corpus to re-derive a measured finding. Minutes, not milliseconds; skip with -m 'not slow'.",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
